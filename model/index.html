<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101118">
<link rel="icon" type="image/png" href="/img/logo-64.png"><link rel="apple-touch-icon" href="/img/logo-192.png">
<title>FireDex · Modelador</title>
<link rel="stylesheet" href="/css/model.css">
<script src="/js/diag.js"></script>
<script src="/js/i18n.js"></script>
</head>
<body>
<div class="app" id="app" data-mode="edit" data-sheet="" data-ptab="outliner">

  <!-- ───────────── Barra superior ───────────── -->
  <header class="top">
    <a class="ib" id="backBtn" href="/edit/" title="Volver al editor"><i data-i="back"></i></a>
    <div class="ttl">
      <b id="fileName">modelo.geo.json</b>
      <small id="saveState"><span class="dot"></span><span id="saveTxt">Listo</span></small>
    </div>
    <div class="modes" role="tablist">
      <button class="mode on" data-mode="edit" role="tab" title="Modelar (1)"><i data-i="cube"></i><span>Modelar</span></button>
      <button class="mode" data-mode="uv" role="tab" title="Mapeo UV (2)"><i data-i="uv"></i><span>Mapeo</span></button>
      <button class="mode" data-mode="paint" role="tab" title="Pintar (3)"><i data-i="brush"></i><span>Pintar</span></button>
      <button class="mode" data-mode="anim" role="tab" title="Animar (4)"><i data-i="film"></i><span>Animar</span></button>
    </div>
    <div class="sp"></div>
    <button class="chk" id="chkBtn" title="Revisión del modelo (detecta errores)"><i data-i="shield"></i><span id="chkTxt">Revisar</span><b id="chkN" hidden>0</b></button>
    <span class="vsep"></span>
    <button class="ib" id="histBtn" title="Historial de cambios"><i data-i="hist"></i></button>
    <button class="ib" id="undoBtn" title="Deshacer (Ctrl+Z)"><i data-i="undo"></i></button>
    <button class="ib" id="redoBtn" title="Rehacer (Ctrl+Shift+Z)"><i data-i="redo"></i></button>
    <button class="ib save" id="saveBtn" title="Guardar (Ctrl+S)"><i data-i="save"></i></button>
    <button class="ib" id="intBtn" title="Addon: entidad, paquete y exportación"><i data-i="plug"></i></button>
    <button class="ib" id="menuBtn" title="Menú"><i data-i="more"></i></button>
    <div class="menu" id="menu" hidden></div>
  </header>

  <!-- ───────────── Herramientas ───────────── -->
  <nav class="tools" id="tools">
    <div class="tgroup" data-for="edit">
      <button class="tool on" data-tool="select" title="Seleccionar (V)"><i data-i="cursor"></i><small>Elegir</small></button>
      <button class="tool" data-tool="move" title="Mover (G)"><i data-i="move"></i><small>Mover</small></button>
      <button class="tool" data-tool="rotate" title="Rotar (R)"><i data-i="rotate"></i><small>Rotar</small></button>
      <button class="tool" data-tool="scale" title="Tamaño (S)"><i data-i="scale"></i><small>Tamaño</small></button>
      <span class="tsep"></span>
      <button class="tool act" id="addCube" title="Añadir cubo (Shift+A)"><i data-i="cubeplus"></i><small>Cubo</small></button>
      <button class="tool act" id="addBone" title="Añadir hueso (Shift+B)"><i data-i="bone"></i><small>Hueso</small></button>
      <button class="tool act" id="dupBtn" title="Duplicar (Ctrl+D)"><i data-i="copy"></i><small>Duplicar</small></button>
      <button class="tool act" id="mirBtn" title="Espejo en X (Shift+M)"><i data-i="mirror"></i><small>Espejo</small></button>
      <button class="tool act danger" id="delBtn" title="Eliminar (Supr)"><i data-i="trash"></i><small>Borrar</small></button>
      <span class="tsep"></span>
      <button class="tool tog" id="symBtn" title="Simetría en X: lo que edites se refleja en la pieza opuesta"><i data-i="sym"></i><small>Simetría</small></button>
      <button class="tool act" id="moreToolsBtn" title="Más herramientas"><i data-i="wand"></i><small>Más</small></button>
    </div>
    <div class="tgroup" data-for="uv">
      <button class="tool act" id="uvAutoAll" title="Reorganizar todos los UV sin solaparse"><i data-i="wand"></i><small>Auto UV</small></button>
      <button class="tool act" id="uvSnapBtn" title="Ajustar al píxel entero"><i data-i="ruler"></i><small>Píxel</small></button>
      <button class="tool act" id="uvFacesBtn" title="Cambiar entre UV de caja y UV por caras"><i data-i="uvfaces"></i><small>Caras</small></button>
      <button class="tool act" id="uvFitBtn" title="Ajustar el tamaño del modelo a la textura"><i data-i="expand"></i><small>Ajustar</small></button>
      <button class="tool act" id="uvBaseBtn" title="Rellenar la textura con el color de cada cubo"><i data-i="palette"></i><small>Base</small></button>
    </div>
    <div class="tgroup" data-for="paint">
      <button class="tool on" data-ptool="pencil" title="Lápiz (B)"><i data-i="pencil"></i><small>Lápiz</small></button>
      <button class="tool" data-ptool="eraser" title="Borrador (E)"><i data-i="eraser"></i><small>Borrar</small></button>
      <button class="tool" data-ptool="bucket" title="Relleno (F)"><i data-i="bucket"></i><small>Relleno</small></button>
      <button class="tool" data-ptool="face" title="Rellenar cara completa (C)"><i data-i="faceFill"></i><small>Cara</small></button>
      <button class="tool" data-ptool="picker" title="Cuentagotas (I)"><i data-i="picker"></i><small>Gotero</small></button>
      <span class="tsep"></span>
      <button class="tool act" id="paintBaseBtn" title="Rellenar la textura con el color de cada cubo"><i data-i="palette"></i><small>Base</small></button>
      <button class="tool tog" id="paintMirBtn" title="Pintar también en el lado opuesto (X)"><i data-i="sym"></i><small>Espejo</small></button>
    </div>
    <div class="tgroup" data-for="anim">
      <button class="tool on" data-tool="select" title="Seleccionar (V)"><i data-i="cursor"></i><small>Elegir</small></button>
      <button class="tool" data-tool="move" title="Mover hueso (G)"><i data-i="move"></i><small>Mover</small></button>
      <button class="tool" data-tool="rotate" title="Rotar hueso (R)"><i data-i="rotate"></i><small>Rotar</small></button>
      <button class="tool" data-tool="scale" title="Escalar hueso (S)"><i data-i="scale"></i><small>Escala</small></button>
      <span class="tsep"></span>
      <button class="tool act" id="keyAdd" title="Añadir clave en el tiempo actual (K)"><i data-i="key"></i><small>Clave</small></button>
      <button class="tool act" id="keyReset" title="Quitar la pose del hueso en este tiempo"><i data-i="eraser"></i><small>Quitar</small></button>
      <button class="tool act" id="keyMirror" title="Copiar la pose al hueso opuesto (espejo)"><i data-i="mirror"></i><small>Espejo</small></button>
    </div>
  </nav>
  <div class="pop" id="morePop" hidden></div>

  <!-- ───────────── Vista 3D ───────────── -->
  <main class="view" id="view">
    <canvas id="gl"></canvas>
    <canvas id="ov"></canvas>
    <div class="vhud vl">
      <button class="chip" id="snapBtn" title="Ajuste al mover">Ajuste 1</button>
      <button class="chip" id="viewBtn" title="Perspectiva / ortogonal">Perspectiva</button>
      <button class="chip" id="shadeBtn" title="Cómo se ve el modelo"><i data-i="palette"></i><span>Auto</span></button>
      <span class="chipgrp">
        <button class="chip ic" id="gridBtn" title="Cuadrícula"><i data-i="grid"></i></button>
        <button class="chip ic" id="wireBtn" title="Mostrar contornos de caras"><i data-i="wire"></i></button>
        <button class="chip ic" id="skelBtn" title="Mostrar esqueleto y pivotes"><i data-i="skeleton"></i></button>
        <button class="chip ic" id="refBtn" title="Silueta de referencia (jugador)"><i data-i="user"></i></button>
      </span>
    </div>
    <div class="vhud vr">
      <span class="chipgrp">
        <button class="chip" data-view="front" title="Vista frontal (Num 1)">Frente</button>
        <button class="chip" data-view="side" title="Vista lateral (Num 3)">Lado</button>
        <button class="chip" data-view="top" title="Vista superior (Num 7)">Arriba</button>
        <button class="chip" data-view="iso" title="Vista isométrica (Num 0)">Iso</button>
        <button class="chip ic" id="frameBtn" title="Encuadrar el modelo (F)"><i data-i="target"></i></button>
      </span>
    </div>
    <div class="vinfo" id="vinfo"></div>
    <div class="vhelp" id="vhelp"></div>
    <div class="vdrop" id="vdrop" hidden><div><i data-i="upload"></i><b>Suelta aquí tus archivos</b><span>.geo.json · .png · .animation.json · .zip / .mcpack</span></div></div>
    <div class="nogl" id="noGl" hidden>
      <b>Tu navegador no pudo iniciar WebGL</b>
      <span>Activa la aceleración por hardware o prueba otro navegador.</span>
    </div>
  </main>

  <!-- ───────────── Línea de tiempo ───────────── -->
  <section class="tl" id="tl">
    <div class="tl-grip" id="tlGrip" title="Arrastra para cambiar la altura"></div>
    <div class="tl-bar">
      <select id="animSel" title="Animación"></select>
      <button class="ib sm" id="animNew" title="Nueva animación"><i data-i="plus"></i></button>
      <button class="ib sm" id="animDel" title="Eliminar animación"><i data-i="trash"></i></button>
      <span class="tsep v"></span>
      <button class="ib sm" id="tPrevKey" title="Clave anterior ([)"><i data-i="prevkey"></i></button>
      <button class="ib" id="tPlay" title="Reproducir (Espacio)"><i data-i="play"></i></button>
      <button class="ib sm" id="tNextKey" title="Clave siguiente (])"><i data-i="nextkey"></i></button>
      <button class="ib sm" id="tStop" title="Detener y volver al inicio"><i data-i="stop"></i></button>
      <label class="tnum" title="Tiempo actual (s)"><input type="number" id="tTime" step="0.05" min="0" value="0"><small>s</small></label>
      <label class="tnum" title="Duración (s)"><small>dur</small><input type="number" id="tLen" step="0.1" min="0.05" value="1"></label>
      <select id="tLoop" title="Repetición"><option value="true">Bucle</option><option value="false">Una vez</option><option value="hold_on_last_frame">Mantener final</option></select>
      <select id="tSpeed" title="Velocidad de reproducción"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
      <select id="tSnap" title="Ajuste del tiempo"><option value="0.05">1/20 s</option><option value="0.025">1/40 s</option><option value="0.1">0.1 s</option><option value="0.25">0.25 s</option><option value="0">Libre</option></select>
      <span class="grow"></span>
      <button class="chip" id="tAll" title="Mostrar todos los huesos en la línea de tiempo"><i data-i="bone"></i><span>Todos</span></button>
      <span class="tfile" id="tFile"></span>
    </div>
    <div class="tl-body">
      <div class="tl-names" id="tlNames"></div>
      <div class="tl-track" id="tlTrack"><canvas id="tlCv"></canvas></div>
    </div>
  </section>

  <!-- ───────────── Panel lateral ───────────── -->
  <aside class="side" id="side">
    <section class="panel" id="pTop" data-p="outliner">
      <div class="tabs" id="topTabs">
        <button class="tab on" data-ptab="outliner"><i data-i="layers"></i><span>Esquema</span><small id="outCount"></small></button>
        <button class="tab" data-ptab="textures"><i data-i="image"></i><span>Texturas</span><small id="texCount"></small></button>
      </div>
      <div class="pbody" id="outliner"></div>
      <div class="pbody" id="texList"></div>
    </section>
    <section class="panel" id="pProps" data-p="props">
      <div class="phead"><b id="propsTitle">Propiedades</b><span class="grow"></span><span id="propsTools"></span></div>
      <div class="pbody" id="props"></div>
    </section>
    <section class="panel" id="pPaint" data-p="paint">
      <div class="phead"><b id="pPaintTitle">Pintura</b><span class="grow"></span>
        <button class="ib sm" id="uvBig" title="Ampliar el mapa UV sobre la vista"><i data-i="expand"></i></button>
      </div>
      <div class="pbody pa">
        <div class="pr ptools">
          <input type="color" id="colorIn" value="#7c6cf5" title="Color de pintura">
          <div class="brush"><label class="lab">Pincel <b id="brushVal">1</b> px</label><input type="range" id="brushIn" min="1" max="16" value="1"></div>
        </div>
        <div class="swatches" id="swatches"></div>
        <div class="swatches small" id="recent" title="Colores recientes"></div>
        <div class="pr uvbar">
          <select id="texSel" title="Textura activa"></select>
          <span class="grow"></span>
          <button class="ib sm" id="uvOut" title="Alejar (-)"><i data-i="minus"></i></button>
          <span class="zoomv" id="uvZoomV">400%</span>
          <button class="ib sm" id="uvIn" title="Acercar (+)"><i data-i="plus"></i></button>
          <button class="ib sm" id="uvFit" title="Ajustar al panel"><i data-i="target"></i></button>
        </div>
        <div class="uvwrap" id="uvWrap"><canvas id="uvCv"></canvas><div class="uvinfo" id="uvInfo"></div></div>
      </div>
    </section>
  </aside>

  <!-- ───────────── Revisión (errores) ───────────── -->
  <aside class="drawer" id="drawer" hidden>
    <div class="dhead"><i data-i="shield"></i><b>Revisión del modelo</b><span class="grow"></span>
      <button class="btn sm" id="chkFixAll" title="Aplica todas las correcciones seguras">Corregir todo</button>
      <button class="ib sm" id="chkClose" title="Cerrar"><i data-i="close"></i></button>
    </div>
    <div class="dsum" id="chkSum"></div>
    <div class="dbody" id="chkList"></div>
  </aside>

  <nav class="bnav" id="bnav">
    <button data-sheet="outliner"><i data-i="layers"></i><span>Esquema</span></button>
    <button data-sheet="props"><i data-i="sliders"></i><span>Datos</span></button>
    <button data-sheet="paint"><i data-i="brush"></i><span>Textura</span></button>
    <button data-sheet="check"><i data-i="shield"></i><span>Revisar</span></button>
    <button data-sheet="anim" id="bnAnim"><i data-i="film"></i><span>Línea</span></button>
  </nav>

  <div class="status" id="status"></div>
  <div class="toast" id="toast" hidden></div>
</div>

<input type="file" id="fileIn" accept=".json,.geo.json,application/json" hidden>
<input type="file" id="texIn" accept="image/png,image/*" multiple hidden>
<input type="file" id="packIn" accept=".zip,.mcpack,.mcaddon,.json,.png" multiple hidden>
<script src="/js/vendor/jszip.min.js"></script>
<script src="/js/model.js"></script>
<script src="/js/model-proj.js"></script>
<script src="/js/model-check.js"></script>
<script src="/js/model-anim.js"></script>
<script src="/js/model-int.js"></script>
<script src="/js/model-boot.js"></script>
<script src="/js/cookies.js"></script>
</body>
</html>
